name: Test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  k6-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1

      - name: Run k6 tests
        run: |
          for test in tests/*.js tests/*.ts; do
            echo "::group::k6 run $test"
            k6 run "$test"
            echo "::endgroup::"
          done
